name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (without leading v), e.g. 1.2.0"
        required: true

permissions:
  contents: write

jobs:
  package:
    name: Package .app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaging version $VERSION"

      - name: Test
        run: swift test

      - name: Build .app bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./Packaging/build-app.sh

      - name: Zip bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ditto -c -k --keepParent "dist/MacDirStat.app" "MacDirStat-${VERSION}.zip"
          ls -la "MacDirStat-${VERSION}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacDirStat-${{ steps.version.outputs.version }}
          path: MacDirStat-${{ steps.version.outputs.version }}.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "MacDirStat-${VERSION}.zip" \
            --title "MacDirStat $VERSION" \
            --generate-notes
